{
const go=document.getElementById('go'), badge=document.getElementById('badge'), msg=document.getElementById('msg');
const art=document.getElementById('art'), title=document.getElementById('title'), album=document.getElementById('album'), link=document.getElementById('link');
const ring=document.querySelector('#ring circle'), player=document.getElementById('player');
const CIRC=289;
let songs=[], queue=0, bag=[], errs=0;

function load(){
  const P='https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview';
  songs=SONGS.map(([name,a,p,id])=>{const al=ALBUMS[a];return{
    trackName:name, collectionName:al[0],
    previewUrl:p[0]==='!'?p.slice(1):P+p,
    artworkUrl:'https://'+al[2]+'/300x300bb.jpg',
    trackViewUrl:'https://music.apple.com/us/album/'+al[1]+'?i='+id}});
  go.disabled=false; msg.textContent=songs.length+' songs ready. Tap +30.';
}
// Shuffle-bag: no repeats until every song has played once
function pick(){
  if(!bag.length){bag=songs.slice();for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
  return bag.pop();
}
function playNext(){
  const t=pick();
  player.src=t.previewUrl;
  title.textContent=t.trackName;
  album.textContent=t.collectionName;
  art.src=t.artworkUrl;art.style.visibility='visible';
  link.href=t.trackViewUrl;link.style.display='inline';
  const p=player.play();
  if(p&&p.catch)p.catch(()=>{msg.textContent='Tap +30 again to start sound.';});
  msg.textContent='';
}
function updateBadge(){badge.style.display=queue?'block':'none';badge.textContent='+'+queue}
go.addEventListener('click',()=>{
  if(!songs.length)return;
  if(player.paused||player.ended){playNext()}
  else{queue++;updateBadge();msg.textContent=queue===1?'1 more song queued':queue+' more songs queued'}
});
player.addEventListener('ended',()=>{
  ring.style.strokeDashoffset=CIRC;
  if(queue>0){queue--;updateBadge();playNext()}
  else msg.textContent='Tap +30 for another.';
});
player.addEventListener('timeupdate',()=>{
  const d=player.duration||30;ring.style.strokeDashoffset=CIRC*(1-Math.min(player.currentTime/d,1));
});
player.addEventListener('playing',()=>{errs=0});
player.addEventListener('error',()=>{ if(++errs>3){msg.textContent='Having trouble playing songs. Check your connection.';return} playNext(); });
load();
}
</script>
