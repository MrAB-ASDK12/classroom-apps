<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Niche Classroom Apps</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F0E6;color:#1E2A32;font:18px/1.5 system-ui,sans-serif;text-align:center;padding:24px}h1{font-size:40px;margin:0 0 8px}a{color:#1F5F66;font-weight:700}</style>
</head>
<body>
<div><h1>That page isn't here</h1><p>It may have moved. <a href="/" id="home">Go to all the apps</a>.</p></div>
<script>
// GitHub Pages project sites live at /<repo>/, so send people to the repo's homepage.
var p=location.pathname.split('/').filter(Boolean);
if(location.hostname.endsWith('github.io')&&p.length)document.getElementById('home').href='/'+p[0]+'/';
</script>
</body>
</html>
