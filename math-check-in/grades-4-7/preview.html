<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec; --card:#ffffff; --ink:#1d2733; --muted:#5d6876; --line:#dcd6ca;
    --accent:#0e6b62; --accent-ink:#ffffff; --accent-soft:#e3f1ee; --tint:#eef5f3;
    --warn:#9a3412; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:19px;line-height:1.45;-webkit-font-smoothing:antialiased}
  main{max-width:760px;margin:0 auto;padding:20px 18px 48px}
  .demo{background:#fff4d6;border:1px solid #ecd9a0;color:#6b4e00;border-radius:10px;
    padding:8px 12px;font-size:15px;margin-bottom:14px}
  header.bar{display:flex;align-items:center;gap:14px;margin:4px 0 16px}
  .count{font-weight:700;font-size:16px;color:var(--muted);white-space:nowrap}
  .track{flex:1;height:10px;background:#e7e1d6;border-radius:99px;overflow:hidden}
  .fill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
  .linkbtn{background:none;border:none;color:var(--muted);font:inherit;font-size:15px;
    text-decoration:underline;cursor:pointer;padding:4px;white-space:nowrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 24px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  h1{font-size:30px;line-height:1.15;margin:0 0 10px}
  h2{font-size:21px;margin:0 0 6px}
  p{margin:0 0 12px}
  .prompt{font-size:24px;line-height:1.4;margin:0 0 16px}
  .figure{display:flex;justify-content:center;margin:4px 0 16px;color:var(--ink)}
  .figure svg{max-width:100%;height:auto}
  table.tbl{border-collapse:collapse;margin:4px 0 14px;font-size:21px}
  table.tbl th,table.tbl td{border:2px solid var(--line);padding:6px 16px;text-align:center}
  table.tbl th{background:var(--tint)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
  @media (max-width:560px){.opts{grid-template-columns:1fr}}
  .opt{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;
    border:2px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;
    font-size:21px;color:var(--ink);cursor:pointer;min-height:64px;transition:border-color .12s,background .12s}
  .opt:hover{border-color:#a9b8b4}
  .opt .ltr{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    background:var(--tint);font-weight:700;font-size:17px;color:var(--accent)}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .opt[aria-pressed="true"] .ltr{background:var(--accent);color:var(--accent-ink)}
  .comfort{border-top:1px dashed var(--line);padding-top:18px}
  .comfort h2{font-size:18px;color:var(--muted);font-weight:700}
  .scale{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
  @media (max-width:560px){.scale{grid-template-columns:1fr 1fr}}
  .lk{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 8px;
    font:inherit;font-size:15px;line-height:1.25;color:var(--ink);cursor:pointer;display:flex;
    flex-direction:column;align-items:center;gap:4px;min-height:92px;justify-content:center}
  .lk .em{font-size:28px;line-height:1}
  .lk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
  .actions{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:22px}
  .hint{color:var(--muted);font-size:15px;margin-right:auto}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;
    padding:14px 28px;font:inherit;font-weight:700;font-size:19px;cursor:pointer;white-space:nowrap}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
  label{display:block;font-weight:700;font-size:16px;margin:14px 0 6px}
  input[type=text]{width:100%;font:inherit;font-size:21px;padding:12px 14px;border:2px solid var(--line);
    border-radius:12px;background:#fff;color:var(--ink)}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  .err{color:var(--warn);font-size:16px;margin-top:10px;min-height:1.2em}
  ul.tips{padding-left:22px;margin:6px 0 4px} ul.tips li{margin:4px 0}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
    font-size:.82em;line-height:1.05;margin:0 .12em}
  .frac .n{border-bottom:2px solid currentColor;padding:0 .18em}
  .frac .d{padding:0 .18em}
  .mixed{white-space:nowrap}
  .big{font-size:64px;text-align:center;margin:6px 0 2px}
  .center{text-align:center}
  /* demo results */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
  .stat{background:var(--tint);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:26px}
  .stat span{font-size:13px;color:var(--muted)}
  table.res{width:100%;border-collapse:collapse;font-size:16px;margin-top:8px}
  table.res th,table.res td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
  table.res td.num{text-align:right;font-variant-numeric:tabular-nums}
  .barcell{width:40%} .mini{height:8px;background:#e7e1d6;border-radius:99px;overflow:hidden}
  .mini i{display:block;height:100%;background:var(--accent)}
  :focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const BANK = [{"id": "Q01", "n": 1, "grade": "4", "standard": "4.NBT.2", "strand": "Whole Numbers", "skill": "Expanded form", "prompt": "Which number equals 40,000 + 3,000 + 60 + 5?", "options": ["430,065", "43,605", "43,065", "4,365"], "answer": 2, "svg": ""}, {"id": "Q02", "n": 2, "grade": "4", "standard": "4.NBT.1", "strand": "Whole Numbers", "skill": "Place value", "prompt": "What is the value of the 7 in 572,814?", "options": ["700,000", "70,000", "700", "7,000"], "answer": 1, "svg": ""}, {"id": "Q03", "n": 3, "grade": "4", "standard": "4.NBT.3", "strand": "Whole Numbers", "skill": "Rounding", "prompt": "Round 68,452 to the nearest thousand.", "options": ["69,000", "68,500", "68,000", "70,000"], "answer": 2, "svg": ""}, {"id": "Q04", "n": 4, "grade": "4", "standard": "4.NBT.4", "strand": "Whole Numbers", "skill": "Subtract with regrouping", "prompt": "6,005 − 2,378 = ?", "options": ["4,373", "3,627", "4,627", "3,737"], "answer": 1, "svg": ""}, {"id": "Q05", "n": 5, "grade": "4", "standard": "4.NBT.5", "strand": "Whole Numbers", "skill": "Multiply 2-digit × 2-digit", "prompt": "46 × 37 = ?", "options": ["1,712", "1,702", "460", "1,602"], "answer": 1, "svg": ""}, {"id": "Q06", "n": 6, "grade": "4", "standard": "4.NBT.6", "strand": "Whole Numbers", "skill": "Divide by 1 digit", "prompt": "1,248 ÷ 6 = ?", "options": ["208", "28", "218", "280"], "answer": 0, "svg": ""}, {"id": "Q07", "n": 7, "grade": "4", "standard": "4.OA.2", "strand": "Whole Numbers", "skill": "Multiplicative comparison", "prompt": "Maya has 9 stickers. Leo has 4 times as many stickers as Maya. How many stickers does Leo have?", "options": ["32", "13", "5", "36"], "answer": 3, "svg": ""}, {"id": "Q08", "n": 8, "grade": "4", "standard": "4.OA.3", "strand": "Whole Numbers", "skill": "Multi-step word problem", "prompt": "A school orders 8 boxes of pencils with 24 pencils in each box. The teachers hand out 150 pencils. How many pencils are left?", "options": ["192", "32", "42", "58"], "answer": 2, "svg": ""}, {"id": "Q09", "n": 9, "grade": "4", "standard": "4.OA.4", "strand": "Number System", "skill": "Factors", "prompt": "Which list shows ALL the factors of 18?", "options": ["1, 2, 9, 18", "1, 2, 3, 6, 9, 18", "2, 3, 6, 9", "1, 3, 6, 18"], "answer": 1, "svg": ""}, {"id": "Q10", "n": 10, "grade": "4", "standard": "4.OA.4", "strand": "Number System", "skill": "Prime numbers", "prompt": "Which of these is a prime number?", "options": ["27", "29", "33", "21"], "answer": 1, "svg": ""}, {"id": "Q11", "n": 11, "grade": "4", "standard": "4.OA.5", "strand": "Expressions & Equations", "skill": "Number patterns", "prompt": "A pattern starts at 4 and follows the rule “add 6”: 4, 10, 16, 22, … What is the 7th number in the pattern?", "options": ["34", "40", "46", "42"], "answer": 1, "svg": ""}, {"id": "Q12", "n": 12, "grade": "4", "standard": "4.NF.1", "strand": "Fractions", "skill": "Equivalent fractions", "prompt": "Which fraction is equivalent to {3/4}?", "options": ["{4/5}", "{6/4}", "{3/8}", "{6/8}"], "answer": 3, "svg": ""}, {"id": "Q13", "n": 13, "grade": "4", "standard": "4.NF.2", "strand": "Fractions", "skill": "Compare fractions", "prompt": "Which fraction is the greatest?", "options": ["{2/3}", "{7/12}", "{3/5}", "{5/8}"], "answer": 0, "svg": ""}, {"id": "Q14", "n": 14, "grade": "4", "standard": "4.NF.3", "strand": "Fractions", "skill": "Add like denominators", "prompt": "{5/8} + {2/8} = ?", "options": ["{7/16}", "{7/8}", "{3/8}", "{10/16}"], "answer": 1, "svg": ""}, {"id": "Q15", "n": 15, "grade": "4", "standard": "4.NF.3", "strand": "Fractions", "skill": "Subtract mixed numbers", "prompt": "3{1/4} − 1{3/4} = ?", "options": ["1{1/2}", "1{3/4}", "2{1/2}", "2"], "answer": 0, "svg": ""}, {"id": "Q16", "n": 16, "grade": "4", "standard": "4.NF.4", "strand": "Fractions", "skill": "Whole number × fraction", "prompt": "4 × {2/3} = ?", "options": ["{2/12}", "{6/7}", "{8/3}", "{8/12}"], "answer": 2, "svg": ""}, {"id": "Q17", "n": 17, "grade": "4", "standard": "4.NF.5", "strand": "Decimals", "skill": "Tenths + hundredths", "prompt": "{3/10} + {45/100} = ?", "options": ["{48/110}", "{78/100}", "{48/100}", "{75/100}"], "answer": 3, "svg": ""}, {"id": "Q18", "n": 18, "grade": "4", "standard": "4.NF.7", "strand": "Decimals", "skill": "Compare decimals", "prompt": "Which decimal is the greatest?", "options": ["0.65", "0.7", "0.09", "0.507"], "answer": 1, "svg": ""}, {"id": "Q19", "n": 19, "grade": "4", "standard": "4.MD.1", "strand": "Measurement & Geometry", "skill": "Convert time", "prompt": "How many minutes are in 3{1/2} hours?", "options": ["210", "350", "200", "180"], "answer": 0, "svg": ""}, {"id": "Q20", "n": 20, "grade": "4", "standard": "4.MD.3", "strand": "Measurement & Geometry", "skill": "Area and perimeter", "prompt": "A rectangle has an area of 72 square feet. Its length is 9 feet. What is its perimeter?", "options": ["81 feet", "72 feet", "17 feet", "34 feet"], "answer": 3, "svg": ""}, {"id": "Q21", "n": 21, "grade": "4", "standard": "4.MD.7", "strand": "Measurement & Geometry", "skill": "Unknown angle", "prompt": "The right angle below is split into two angles. One angle is 35°. What is the other angle?", "options": ["65°", "45°", "145°", "55°"], "answer": 3, "svg": "<svg viewBox=\"0 0 220 170\" width=\"220\" role=\"img\" aria-label=\"A right angle split into two angles, one is 35 degrees\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\">\n<path d=\"M30 150 L210 150\"/><path d=\"M30 150 L30 10\"/><path d=\"M30 150 L190 50\"/>\n<path d=\"M30 130 L50 130 L50 150\"/>\n</g>\n<g font-size=\"17\" fill=\"currentColor\" font-family=\"inherit\">\n<text x=\"112\" y=\"140\">35°</text><text x=\"58\" y=\"72\">?</text>\n</g></svg>"}, {"id": "Q22", "n": 22, "grade": "4", "standard": "4.G.2", "strand": "Measurement & Geometry", "skill": "Classify shapes", "prompt": "Which shape ALWAYS has two pairs of parallel sides AND four right angles?", "options": ["Trapezoid", "Rhombus", "Rectangle", "Parallelogram"], "answer": 2, "svg": ""}, {"id": "Q23", "n": 23, "grade": "5", "standard": "5.NBT.1", "strand": "Decimals", "skill": "Place value patterns", "prompt": "The 4 in 0.48 is worth ______ the 4 in 0.048.", "options": ["the same as", "100 times", "{1/10} of", "10 times"], "answer": 3, "svg": ""}, {"id": "Q24", "n": 24, "grade": "5", "standard": "5.NBT.2", "strand": "Decimals", "skill": "Multiply by powers of 10", "prompt": "3.6 × 1,000 = ?", "options": ["3,600", "360", "3.6000", "36,000"], "answer": 0, "svg": ""}, {"id": "Q25", "n": 25, "grade": "5", "standard": "5.NBT.3", "strand": "Decimals", "skill": "Decimal expanded form", "prompt": "Which shows 5.083 in expanded form?", "options": ["5 + 0.08 + 0.003", "50 + 8 + 3", "5 + 0.08 + 0.3", "5 + 0.8 + 0.03"], "answer": 0, "svg": ""}, {"id": "Q26", "n": 26, "grade": "5", "standard": "5.NBT.4", "strand": "Decimals", "skill": "Round decimals", "prompt": "Round 7.462 to the nearest tenth.", "options": ["7.46", "8", "7.4", "7.5"], "answer": 3, "svg": ""}, {"id": "Q27", "n": 27, "grade": "5", "standard": "5.NBT.5", "strand": "Whole Numbers", "skill": "Multi-digit multiplication", "prompt": "324 × 25 = ?", "options": ["8,400", "8,100", "7,100", "2,268"], "answer": 1, "svg": ""}, {"id": "Q28", "n": 28, "grade": "5", "standard": "5.NBT.6", "strand": "Whole Numbers", "skill": "Divide by 2 digits", "prompt": "2,016 ÷ 24 = ?", "options": ["94", "74", "84", "804"], "answer": 2, "svg": ""}, {"id": "Q29", "n": 29, "grade": "5", "standard": "5.NBT.7", "strand": "Decimals", "skill": "Add decimals", "prompt": "4.5 + 2.75 = ?", "options": ["7.25", "3.20", "7.70", "6.80"], "answer": 0, "svg": ""}, {"id": "Q30", "n": 30, "grade": "5", "standard": "5.NBT.7", "strand": "Decimals", "skill": "Multiply decimals", "prompt": "3.2 × 0.4 = ?", "options": ["12.8", "0.128", "1.208", "1.28"], "answer": 3, "svg": ""}, {"id": "Q31", "n": 31, "grade": "5", "standard": "5.NBT.7", "strand": "Decimals", "skill": "Divide by a decimal", "prompt": "6 ÷ 0.3 = ?", "options": ["1.8", "20", "0.2", "2"], "answer": 1, "svg": ""}, {"id": "Q32", "n": 32, "grade": "5", "standard": "5.NF.1", "strand": "Fractions", "skill": "Add unlike denominators", "prompt": "{2/3} + {1/4} = ?", "options": ["{3/12}", "{11/12}", "{3/7}", "{2/12}"], "answer": 1, "svg": ""}, {"id": "Q33", "n": 33, "grade": "5", "standard": "5.NF.1", "strand": "Fractions", "skill": "Subtract mixed (regroup)", "prompt": "5{1/2} − 2{2/3} = ?", "options": ["3{1/6}", "3{5/6}", "2{1/6}", "2{5/6}"], "answer": 3, "svg": ""}, {"id": "Q34", "n": 34, "grade": "5", "standard": "5.NF.2", "strand": "Fractions", "skill": "Fraction word problem", "prompt": "Ana ran {3/4} of a mile on Monday and {2/5} of a mile on Tuesday. How much farther did she run on Monday?", "options": ["{7/20} mile", "1{3/20} miles", "{1/20} mile", "{5/20} mile"], "answer": 0, "svg": ""}, {"id": "Q35", "n": 35, "grade": "5", "standard": "5.NF.3", "strand": "Fractions", "skill": "Fraction as division", "prompt": "7 friends share 3 pizzas equally. How much pizza does each friend get?", "options": ["{1/7} of a pizza", "{4/7} of a pizza", "{7/3} of a pizza", "{3/7} of a pizza"], "answer": 3, "svg": ""}, {"id": "Q36", "n": 36, "grade": "5", "standard": "5.NF.4", "strand": "Fractions", "skill": "Multiply fractions", "prompt": "{2/3} × {3/5} = ?", "options": ["{5/8}", "{10/9}", "{2/5}", "{5/15}"], "answer": 2, "svg": ""}, {"id": "Q37", "n": 37, "grade": "5", "standard": "5.NF.5", "strand": "Fractions", "skill": "Multiplication as scaling", "prompt": "Without calculating: {7/8} × 45 is …", "options": ["impossible to tell", "greater than 45", "less than 45", "equal to 45"], "answer": 2, "svg": ""}, {"id": "Q38", "n": 38, "grade": "5", "standard": "5.NF.6", "strand": "Fractions", "skill": "Mixed number word problem", "prompt": "A recipe uses 2{1/2} cups of flour for one batch. How much flour is needed for 3 batches?", "options": ["5{1/2} cups", "8{1/2} cups", "7{1/2} cups", "6{1/2} cups"], "answer": 2, "svg": ""}, {"id": "Q39", "n": 39, "grade": "5", "standard": "5.NF.7", "strand": "Fractions", "skill": "Whole ÷ unit fraction", "prompt": "4 ÷ {1/3} = ?", "options": ["{1/12}", "7", "12", "{4/3}"], "answer": 2, "svg": ""}, {"id": "Q40", "n": 40, "grade": "5", "standard": "5.NF.7", "strand": "Fractions", "skill": "Unit fraction ÷ whole", "prompt": "{1/4} ÷ 2 = ?", "options": ["8", "{1/2}", "{1/8}", "{1/6}"], "answer": 2, "svg": ""}, {"id": "Q41", "n": 41, "grade": "5", "standard": "5.OA.1", "strand": "Expressions & Equations", "skill": "Order of operations", "prompt": "18 − 3 × (2 + 4) = ?", "options": ["54", "0", "90", "16"], "answer": 1, "svg": ""}, {"id": "Q42", "n": 42, "grade": "5", "standard": "5.OA.2", "strand": "Expressions & Equations", "skill": "Write numerical expressions", "prompt": "Which expression means “add 8 and 7, then multiply by 3”?", "options": ["3 × (8 + 7)", "3 + 8 × 7", "3 × 8 + 7", "8 + 7 × 3"], "answer": 0, "svg": ""}, {"id": "Q43", "n": 43, "grade": "5", "standard": "5.OA.3", "strand": "Expressions & Equations", "skill": "Related patterns", "prompt": "Pattern A: 0, 2, 4, 6, 8 …<br>Pattern B: 0, 6, 12, 18, 24 …<br>How does each number in Pattern B compare to the matching number in Pattern A?", "options": ["It is 3 times as much", "It is 2 times as much", "It is 6 times as much", "It is 4 more"], "answer": 0, "svg": ""}, {"id": "Q44", "n": 44, "grade": "5", "standard": "5.MD.1", "strand": "Measurement & Geometry", "skill": "Convert metric units", "prompt": "How many centimeters are in 4.2 meters?", "options": ["42 cm", "4,200 cm", "0.42 cm", "420 cm"], "answer": 3, "svg": ""}, {"id": "Q45", "n": 45, "grade": "5", "standard": "5.MD.5", "strand": "Measurement & Geometry", "skill": "Volume of a prism", "prompt": "What is the volume of this rectangular prism?", "options": ["20 cubic cm", "94 cubic cm", "12 cubic cm", "60 cubic cm"], "answer": 3, "svg": "<svg viewBox=\"-12 0 272 170\" width=\"272\" role=\"img\" aria-label=\"Rectangular prism 5 cm long, 4 cm wi  He now has $96. How many weeks has he been saving?", "options": ["768 weeks", "12 weeks", "88 weeks", "104 weeks"], "answer": 1, "svg": ""}, {"id": "Q72", "n": 72, "grade": "6", "standard": "6.EE.8", "strand": "Expressions & Equations", "skill": "Inequalities", "prompt": "Which number is a solution to 2<em>x</em> &lt; 10?", "options": ["10", "6", "4", "5"], "answer": 2, "svg": ""}, {"id": "Q73", "n": 73, "grade": "6", "standard": "6.EE.9", "strand": "Expressions & Equations", "skill": "Equation from a table", "prompt": "<table class='tbl'><tr><th><em>x</em></th><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th><em>y</em></th><td>5</td><td>9</td><td>13</td><td>17</td></tr></table>Which equation matches the table?", "options": ["<em>y</em> = 4<em>x</em> + 1", "<em>y</em> = <em>x</em> + 4", "<em>y</em> = 4<em>x</em>", "<em>y</em> = 5<em>x</em>"], "answer": 0, "svg": ""}, {"id": "Q74", "n": 74, "grade": "7", "standard": "7.EE.4", "strand": "Expressions & Equations", "skill": "Two-step equation", "prompt": "Solve: 3<em>x</em> + 4 = 19", "options": ["<em>x</em> = 6", "<em>x</em> = 15", "<em>x</em> = 5", "<em>x</em> = 7{2/3}"], "answer": 2, "svg": ""}, {"id": "Q75", "n": 75, "grade": "7", "standard": "7.EE.4", "strand": "Expressions & Equations", "skill": "Equation with parentheses", "prompt": "Solve: 2(<em>x</em> − 3) = 14", "options": ["<em>x</em> = 4", "<em>x</em> = 8{1/2}", "<em>x</em> = 17", "<em>x</em> = 10"], "answer": 3, "svg": ""}];
const LIVE = (typeof google !== 'undefined' && google.script && google.script.run) ? true : false;

const COMFORT = [
  {v:1, em:'😟', t:'I don’t know how to do this'},
  {v:2, em:'🤔', t:'I’m a little unsure'},
  {v:3, em:'🙂', t:'I’m pretty sure'},
  {v:4, em:'😎', t:'I’m very sure — I could explain it'}
];
const LETTERS = ['A','B','C','D'];

const S = { student:null, queue:[], pos:0, done:0, choice:null, comfort:null, t0:0, saving:false, log:[] };
const app = document.getElementById('app');

function fmt(s){
  return String(s)
    .replace(/(\d+)\{([^{}\/]+)\/([^{}]+)\}/g,'<span class="mixed">$1<span class="frac"><span class="n">$2</span><span class="d">$3</span></span></span>')
    .replace(/\{([^{}\/]+)\/([^{}]+)\}/g,'<span class="frac"><span class="n">$1</span><span class="d">$2</span></span>');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function demoBanner(){return LIVE?'':'<div class="demo">Preview mode — answers are not saved. In the live version every answer goes to your Google Sheet.</div>';}

/* ---------- Welcome ---------- */
function showWelcome(msg){
  app.innerHTML = demoBanner() + `
  <div class="card">
    <h1>Math Check-In</h1>
    <p>This is <strong>not</strong> a test you pass or fail. It helps your teacher learn what you already know and what to teach next.</p>
    <ul class="tips">
      <li>There is one question on each page. Pick the best answer.</li>
      <li>Then tell us how sure you feel. Be honest — “I don’t know how” is a helpful answer!</li>
      <li>Scratch paper is great. Calculators stay put away.</li>
      <li>You can take a break. Type your name the same way next time and you’ll start where you left off.</li>
    </ul>
    <form id="f" autocomplete="off">
      <label for="fn">First name</label><input type="text" id="fn" maxlength="40" required>
      <label for="ln">Last name</label><input type="text" id="ln" maxlength="40" required>
      <div class="err" id="err">${msg?esc(msg):''}</div>
      <div class="actions"><button class="btn" type="submit" id="go">Start</button></div>
    </form>
  </div>`;
  const f = document.getElementById('f');
  document.getElementById('fn').focus();
  f.addEventListener('submit', e=>{
    e.preventDefault();
    const fn = document.getElementById('fn').value.trim(), ln = document.getElementById('ln').value.trim();
    if(!fn || !ln){ document.getElementById('err').textContent='Please type your first and last name.'; return; }
    const go = document.getElementById('go'); go.disabled = true; go.textContent = 'Loading…';
    if(LIVE){
      google.script.run
        .withSuccessHandler(r=>begin(r))
        .withFailureHandler(err=>{ go.disabled=false; go.textContent='Start';
          document.getElementById('err').textContent='Could not connect. Check the internet and try again.'; })
        .startStudent(fn, ln);
    } else {
      begin({key:(fn+' '+ln).toLowerCase(), first:fn, last:ln, answered:[]});
    }
  });
}

function begin(r){
  S.student = r;
  const answered = new Set(r.answered || []);
  S.queue = BANK.filter(q=>!answered.has(q.id));
  S.done = BANK.length - S.queue.length;
  S.pos = 0;
  if(S.queue.length === 0){ showDone(true); return; }
  if(S.done > 0){ showResume(); return; }
  showQuestion();
}

function showResume(){
  app.innerHTML = demoBanner() + `
  <div class="card center">
    <div class="big">👋</div>
    <h1>Welcome back, ${esc(S.student.first)}!</h1>
    <p>You already finished ${S.done} of ${BANK.length} questions. Let’s keep going.</p>
    <div class="actions" style="justify-content:center"><button class="btn" id="go">Keep going</button></div>
  </div>`;
  const b = document.getElementById('go'); b.focus(); b.onclick = showQuestion;
}

/* ---------- Question page ---------- */
function showQuestion(){
  const q = S.queue[S.pos];
  S.choice = null; S.comfort = null; S.t0 = Date.now(); S.saving = false;
  const n = S.done + 1, N = BANK.length;
  app.innerHTML = demoBanner() + `
  <header class="bar">
    <span class="count">Question ${n} of ${N}</span>
    <div class="track" aria-hidden="true"><div class="fill" style="width:${((n-1)/N*100).toFixed(1)}%"></div></div>
    <button class="linkbtn" id="brk">Take a break</button>
  </header>
  <section class="card">
    <div class="prompt">${fmt(q.prompt)}</div>
    ${q.svg?`<div class="figure">${q.svg}</div>`:''}
    <div class="opts" role="group" aria-label="Answer choices">
      ${q.options.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false"><span class="ltr">${LETTERS[i]}</span><span>${fmt(o)}</span></button>`).join('')}
    </div>
    <div class="comfort">
      <h2>How comfortable were you finding the answer?</h2>
      <div class="scale" role="group" aria-label="How comfortable were you">
        ${COMFORT.map(c=>`<button class="lk" data-v="${c.v}" aria-pressed="false"><span class="em" aria-hidden="true">${c.em}</span>${c.t}</button>`).join('')}
      </div>
    </div>
    <div class="actions">
      <span class="hint" id="hint">Choose an answer and how sure you feel.</span>
      <button class="btn" id="next" disabled>${S.pos === S.queue.length-1 ? 'Finish' : 'Next →'}</button>
    </div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickChoice(+b.dataset.i));
  app.querySelectorAll('.lk').forEach(b=>b.onclick=()=>pickComfort(+b.dataset.v));
  document.getElementById('next').onclick = submit;
  document.getElementById('brk').onclick = showBreak;
  window.scrollTo(0,0);
}
function pickChoice(i){
  if(S.saving) return; S.choice = i;
  app.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.i===i));
  updNext();
}
function pickComfort(v){
  if(S.saving) return; S.comfort = v;
  app.querySelectorAll('.lk').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.v===v));
  updNext();
}
function updNext(){
  const ok = S.choice!==null && S.comfort!==null;
  document.getElementById('next').disabled = !ok;
  document.getElementById('hint').textContent = ok ? '' :
    (S.choice===null ? 'Choose an answer.' : 'Now choose how sure you feel.');
}

function submit(){
  if(S.saving || S.choice===null || S.comfort===null) return;
  S.saving = true;
  const q = S.queue[S.pos];
  const payload = { key:S.student.key, first:S.student.first, last:S.student.last,
    qid:q.id, choice:S.choice, comfort:S.comfort, seconds:Math.round((Date.now()-S.t0)/1000) };
  const btn = document.getElementById('next'); btn.disabled = true; btn.textContent = 'Saving…';
  const advance = ()=>{
    S.done++; S.pos++;
    if(S.pos >= S.queue.length) finish(); else showQuestion();
  };
  if(LIVE){
    google.script.run
      .withSuccessHandler(advance)
      .withFailureHandler(()=>{
        S.saving = false; btn.disabled = false; btn.textContent = 'Try again';
        document.getElementById('hint').textContent = 'That didn’t save. Check the internet, then press Try again.';
      })
      .submitAnswer(payload);
  } else {
    S.log.push({q, choice:S.choice, comfort:S.comfort, correct:S.choice===q.answer, seconds:payload.seconds});
    setTimeout(advance, 150);
  }
}

document.addEventListener('keydown', e=>{
  if(!document.querySelector('.opt') || e.target.tagName==='INPUT') return;
  const k = e.key.toUpperCase();
  const li = LETTERS.indexOf(k);
  if(li>=0){ pickChoice(li); }
  else if(['1','2','3','4'].includes(k)){ pickComfort(+k); }
  else if(k==='ENTER'){ e.preventDefault(); submit(); }
});

/* ---------- Break / done ---------- */
function showBreak(){
  app.innerHTML = demoBanner() + `
  <div class="card center">
    <div class="big">☕</div>
    <h1>Nice work, ${esc(S.student.first)}!</h1>
    <p>Your answers so far are saved. You finished ${S.done} of ${BANK.length} questions.</p>
    <p>When you come back, type your name exactly the same way and you’ll pick up right here.</p>
    <div class="actions" style="justify-content:center">
      <button class="btn ghost" id="back">Keep going now</button>
      <button class="btn" id="out">I’m done for today</button>
    </div>
  </div>`;
  document.getElementById('back').onclick = showQuestion;
  document.getElementById('out').onclick = ()=>{ S.student=null; showWelcome(); };
}

function finish(){
  if(LIVE){
    app.innerHTML = `<div class="card center"><p>Saving your work…</p></div>`;
    google.script.run.withSuccessHandler(()=>showDone()).withFailureHandler(()=>showDone()).finish(S.student.key);
  } else showDone();
}

function showDone(already){
  app.innerHTML = demoBanner() + `
  <div class="card center">
    <div class="big">🎉</div>
    <h1>You did it, ${esc(S.student.first)}!</h1>
    <p>${already ? 'You have already finished every question. ' : ''}Thank you for working so hard and being honest about how you felt.
    Your teacher will use this to plan math just for you.</p>
  </div>` + (LIVE ? '' : demoResults());
}

/* ---------- Preview-only teacher summary ---------- */
function demoResults(){
  const L = S.log; if(!L.length) return '';
  const pct = (a,b)=> b? Math.round(a/b*100)+'%' : '—';
  const right = L.filter(x=>x.correct).length;
  const solid = L.filter(x=>x.correct && x.comfort>=3).length;
  const shaky = L.filter(x=>x.correct && x.comfort<=2).length;
  const mis   = L.filter(x=>!x.correct && x.comfort>=3).length;
  const gap   = L.filter(x=>!x.correct && x.comfort<=2).length;
  const groups = {};
  L.forEach(x=>{ const g = groups[x.q.strand] = groups[x.q.strand]||{n:0,c:0,cf:0}; g.n++; g.c+=x.correct?1:0; g.cf+=x.comfort; });
  const rows = Object.entries(groups).map(([k,g])=>`<tr><td>${esc(k)}</td><td class="num">${g.c}/${g.n}</td>
    <td class="barcell"><div class="mini"><i style="width:${g.c/g.n*100}%"></i></div></td><td class="num">${(g.cf/g.n).toFixed(1)}</td></tr>`).join('');
  return `
  <div class="card" style="margin-top:16px">
    <h2>Teacher view (preview only)</h2>
    <p style="color:var(--muted);font-size:16px">In the live version this lives in your Google Sheet: Student Summary, Item Analysis, and a color-coded Student × Question grid.</p>
    <div class="stats">
      <div class="stat"><b>${right}/${L.length}</b><span>correct (${pct(right,L.length)})</span></div>
      <div class="stat"><b>${solid}</b><span>Solid — right &amp; sure</span></div>
      <div class="stat"><b>${shaky}</b><span>Shaky — right, unsure</span></div>
      <div class="stat"><b>${mis}</b><span>Misconception — wrong &amp; sure</span></div>
    </div>
    <p style="font-size:15px;color:var(--muted)">Gap (wrong &amp; unsure): ${gap}</p>
    <table class="res"><tr><th>Strand</th><th class="num">Correct</th><th></th><th class="num">Avg comfort</th></tr>${rows}</table>
  </div>`;
}

showWelcome();
</script>
</body>
</html>
